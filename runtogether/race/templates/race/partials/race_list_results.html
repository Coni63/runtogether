{% load static tailwind_filters %}

<div id="race-results">
    {% include "race/partials/race_table.html" with races=races %}

    {% if page_obj.paginator.num_pages > 1 %}
    <div class="join mt-6 flex justify-center">
        {% if page_obj.has_previous %}
            <button class="join-item btn btn-sm" 
                    hx-get="?page={{ page_obj.previous_page_number }}" 
                    hx-include="#filter-form"
                    hx-target="#race-list" 
                    hx-push-url="true">
                «
            </button>
        {% else %}
            <button class="join-item btn btn-sm btn-disabled">«</button>
        {% endif %}

        <button class="join-item btn btn-sm no-animation">
            Page {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}
        </button>

        {% if page_obj.has_next %}
            <button class="join-item btn btn-sm" 
                    hx-get="?page={{ page_obj.next_page_number }}" 
                    hx-include="#filter-form"
                    hx-target="#race-list" 
                    hx-push-url="true">
                »
            </button>
        {% else %}
             <button class="join-item btn btn-sm btn-disabled">»</button>
        {% endif %}
    </div>
    {% endif %}
</div>
