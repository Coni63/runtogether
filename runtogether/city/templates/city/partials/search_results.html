{% for city in results %}
    <li>
        <a href="javascript:void(0)"
           class="flex flex-col gap-0 items-start"
           data-id="{{ city.id }}" 
           data-name="{{ city.name }}">
            <span class="font-bold">{{ city.name }}</span>
            <span class="text-xs text-base-content/60">{{ city.country }}</span>
        </a>
    </li>
{% empty %}
    <li>
        <span class="text-base-content/60 italic">No city found.</span>
    </li>
{% endfor %}
